# promtool test rules tests/rules_aup_test.yml
rule_files:
  - ../prometheus/rules/aup.yml

evaluation_interval: 1m

tests:
  # an urgent hit pages at once; the zero row before it does not
  - interval: 1m
    input_series:
      - series: 'aup_webfilter_urgent{fgt="fgt-edge",catdesc="Phishing"}'
        values: "0 0 0 1 1 0"
      - series: 'aup_webfilter_urgent{fgt="fgt-edge",catdesc="Malicious Websites"}'
        values: "0 0 0 0 0 0"
    alert_rule_test:
      - eval_time: 2m
        alertname: AupUrgentCategoryHit
        exp_alerts: []
      - eval_time: 3m
        alertname: AupUrgentCategoryHit
        exp_alerts:
          - exp_labels: {severity: critical, fgt: fgt-edge, catdesc: Phishing}
            exp_annotations:
              summary: "fgt-edge: 1 request(s) to a Phishing site in the last hour, see the report for the workstation"
      - eval_time: 5m
        alertname: AupUrgentCategoryHit
        exp_alerts: []

  # blocked burst needs 20 for ten minutes; 19 never fires
  - interval: 1m
    input_series:
      - series: 'aup_webfilter_blocked_top_source{fgt="fgt-edge",who="192.168.2.23"}'
        values: "19x12 20x12"
    alert_rule_test:
      - eval_time: 12m
        alertname: AupBlockedBurst
        exp_alerts: []
      - eval_time: 24m
        alertname: AupBlockedBurst
        exp_alerts:
          - exp_labels: {severity: warning, fgt: fgt-edge, who: "192.168.2.23"}
            exp_annotations:
              summary: "fgt-edge: 192.168.2.23 was blocked 20 times in the last hour"

  # silent: six hours of 0 (the expected FortiGate written as 0 by aup-report)
  - interval: 1m
    input_series:
      - series: 'aup_webfilter_total{fgt="fgt-edge"}'
        values: "0x400"
    alert_rule_test:
      - eval_time: 5h59m
        alertname: AupSilent
        exp_alerts: []
      - eval_time: 6h1m
        alertname: AupSilent
        exp_alerts:
          - exp_labels: {severity: info, fgt: fgt-edge}
            exp_annotations:
              summary: "fgt-edge logged no web-filter lines for 6 hours, check the profile on the policy and the syslog filter"

  # stale: last run 31 minutes ago, held 10 minutes
  - interval: 1m
    input_series:
      - series: 'aup_report_last_run_timestamp'
        values: "0x60"
    alert_rule_test:
      - eval_time: 45m
        alertname: AupReportStale
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "aup-report has not run for 30 minutes, web-filter metrics are stale"
