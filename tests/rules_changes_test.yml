# promtool test rules tests/rules_changes_test.yml  (clock starts at 0)
rule_files:
  - ../prometheus/rules/changes.yml

evaluation_interval: 1m

tests:
  # a window from 2h to 3h; the record stays "scheduled" and is never marked done
  - interval: 1m
    input_series:
      - series: 'change_window_start_timestamp{id="CR-2026-0001",status="scheduled"}'
        values: "7200x400"
      - series: 'change_window_end_timestamp{id="CR-2026-0001",status="scheduled"}'
        values: "10800x400"
      - series: 'change_record{id="CR-2026-0001",status="scheduled",type="standard",risk="medium",implementer="a",approver="b"}'
        values: "1x400"
    alert_rule_test:
      - eval_time: 1h
        alertname: ChangeStartsSoon
        exp_alerts:
          - exp_labels: {severity: info, id: CR-2026-0001, status: scheduled}
            exp_annotations: {summary: "CR-2026-0001 starts in 1 hours"}
      - eval_time: 2h30m           # inside the window: nothing yet
        alertname: ChangeWindowOverrun
        exp_alerts: []
      - eval_time: 3h59m           # 59 minutes after the window closed: still nothing
        alertname: ChangeWindowOverrun
        exp_alerts: []
      - eval_time: 4h1m            # 61 minutes after: warning
        alertname: ChangeWindowOverrun
        exp_alerts:
          - exp_labels: {severity: warning, id: CR-2026-0001, status: scheduled}
            exp_annotations: {summary: "CR-2026-0001: window closed 61 minutes ago and the record is still scheduled"}

  # a record marked in_progress is an info the whole time
  - interval: 1m
    input_series:
      - series: 'change_record{id="CR-2026-0002",status="in_progress",type="emergency",risk="high",implementer="a",approver="b"}'
        values: "1x10"
      - series: 'changes_textfile_last_run_timestamp'
        values: "0x200"
    alert_rule_test:
      - eval_time: 5m
        alertname: ChangeInProgress
        exp_alerts:
          - exp_labels: {severity: info, id: CR-2026-0002, status: in_progress, type: emergency, risk: high, implementer: a, approver: b}
            exp_annotations: {summary: "CR-2026-0002 is in progress (a, approved by b)"}
      - eval_time: 69m
        alertname: ChangesTextfileStale
        exp_alerts: []
      - eval_time: 71m
        alertname: ChangesTextfileStale
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations: {summary: "changes-textfile has not run for an hour, change metrics are stale"}

  # Day 28: two done high-risk records, one of them drilled; a drilled
  # medium record never shows; a drill older than 90 days is stale, and a
  # rolled_back record's old drill is not
  - interval: 1m
    input_series:
      - series: 'change_record{id="CR-2026-0004",status="done",type="standard",risk="high",implementer="a",approver="b"}'
        values: "1x10"
      - series: 'change_record{id="CR-2026-0005",status="done",type="standard",risk="high",implementer="a",approver="b"}'
        values: "1x10"
      - series: 'change_record{id="CR-2026-0001",status="done",type="standard",risk="medium",implementer="a",approver="b"}'
        values: "1x10"
      - series: 'change_record{id="CR-2026-0009",status="rolled_back",type="standard",risk="high",implementer="a",approver="b"}'
        values: "1x10"
      - series: 'change_rollback_last_drill_timestamp{id="CR-2026-0005"}'
        values: "0x10"                        # drilled at t=0
      - series: 'change_rollback_last_drill_timestamp{id="CR-2026-0001"}'
        values: "0x10"
      - series: 'change_rollback_last_drill_timestamp{id="CR-2026-0009"}'
        values: "0x10"
    alert_rule_test:
      - eval_time: 5m
        alertname: ChangeRollbackUndrilled
        exp_alerts:
          - exp_labels: {severity: info, id: CR-2026-0004, status: done, type: standard, risk: high, implementer: a, approver: b}
            exp_annotations: {summary: "CR-2026-0004 is done at risk high and its rollback has never been drilled"}
      - eval_time: 5m
        alertname: ChangeRollbackDrillStale
        exp_alerts: []

  # the same drills seen 91 days later: stale for the done records only
  - interval: 1d
    input_series:
      - series: 'change_record{id="CR-2026-0005",status="done",type="standard",risk="high",implementer="a",approver="b"}'
        values: "1x100"
      - series: 'change_record{id="CR-2026-0009",status="rolled_back",type="standard",risk="high",implementer="a",approver="b"}'
        values: "1x100"
      - series: 'change_rollback_last_drill_timestamp{id="CR-2026-0005"}'
        values: "0x100"
      - series: 'change_rollback_last_drill_timestamp{id="CR-2026-0009"}'
        values: "0x100"
    alert_rule_test:
      - eval_time: 89d
        alertname: ChangeRollbackDrillStale
        exp_alerts: []
      - eval_time: 91d
        alertname: ChangeRollbackDrillStale
        exp_alerts:
          - exp_labels: {severity: info, id: CR-2026-0005}
            exp_annotations: {summary: "CR-2026-0005: rollback last drilled 91d 0h 0m 0s ago, policy is quarterly"}
